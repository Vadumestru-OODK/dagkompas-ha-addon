name: Dagkompas Sync
version: "1.2.0"
slug: dagkompas_sync
description: Privé opslag voor de planner Dagkompas (taken, dagritme, weekdoelen), optioneel je Google Agenda en meldingen op je telefoon
url: https://dagkompas.oodk.nl
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
startup: application
boot: auto
ports:
  8092/tcp: 8092
ports_description:
  8092/tcp: Sync-server voor Dagkompas (via Nginx Proxy Manager naar buiten)
map:
  - type: share
    read_only: false
options:
  token: ""
  agenda_url: ""
  agenda_url_2: ""
  melding_service: ""
  melding_ochtend: "07:45"
  melding_avond: "20:00"
  app_adres: "https://dagkompas.oodk.nl"
schema:
  token: password
  agenda_url: password?
  agenda_url_2: password?
  melding_service: str?
  melding_ochtend: str?
  melding_avond: str?
  app_adres: str?
