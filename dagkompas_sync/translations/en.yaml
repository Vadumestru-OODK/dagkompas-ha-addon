configuration:
  token:
    name: Token
    description: The same token as in Dagkompas under "Sync-server". Use a long, random token, different from the one for Opticien Sync.
  agenda_url:
    name: Calendar address (Google Calendar)
    description: The secret address in iCal format of your Google Calendar. Read only. Leave empty for no calendar.
  agenda_url_2:
    name: Second calendar address (optional)
    description: A second calendar, for example a shared one. Leave empty to not use it.
network:
  8092/tcp: Sync server for Dagkompas
