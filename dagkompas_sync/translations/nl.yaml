configuration:
  token:
    name: Token
    description: Hetzelfde token als in Dagkompas bij "Sync-server". Gebruik een lang, willekeurig token, anders dan dat van Opticien Sync.
  agenda_url:
    name: Agenda-adres (Google Agenda)
    description: Het geheime adres in iCal-indeling van je Google Agenda. Alleen lezen. Hoe je het vindt staat in Dagkompas bij Ritme, onder Google Agenda. Leeg laten = geen agenda.
  agenda_url_2:
    name: Tweede agenda-adres (optioneel)
    description: Een tweede agenda, bijvoorbeeld van je partner of een gedeelde agenda. Leeg laten = niet gebruiken.
network:
  8092/tcp: Sync-server voor Dagkompas
